name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub release
  id-token: write   # Marketplace Trusted Publishing (OIDC), no token needed

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Open VSX has no trusted publishing; that step is skipped when the secret is not set.
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Integration tests
        run: xvfb-run -a npm run test:integration
      - name: Package
        run: npm run package -- --out repo-visibility.vsix

      # Uses the Trusted Publishing policy on the armanossiloko publisher
      # (repository armanossiloko/repo-visibility, workflow release.yml).
      - name: Publish to the Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath repo-visibility.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish repo-visibility.vsix

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" repo-visibility.vsix --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
