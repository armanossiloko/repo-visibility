name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub release
  id-token: write   # Marketplace Trusted Publishing (OIDC), no token needed

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Integration tests
        run: xvfb-run -a npm run test:integration
      - name: Package
        run: npm run package -- --out repo-visibility.vsix

      # Uses the Trusted Publishing policy on the armanossiloko publisher
      # (repository armanossiloko/repo-visibility, workflow release.yml).
      - name: Publish to the Visual Studio Marketplace
        run: npx vsce publish --oidc --skip-duplicate --packagePath repo-visibility.vsix

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" repo-visibility.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" repo-visibility.vsix --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
