name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub release
  id-token: write   # Trusted Publishing (OIDC) to both stores, no tokens needed

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Integration tests
        run: xvfb-run -a npm run test:integration
      - name: Package
        run: npm run package -- --out repo-visibility.vsix

      # Uses the Trusted Publishing policy on the armanossiloko publisher
      # (repository armanossiloko/repo-visibility, workflow release.yml).
      - name: Publish to the Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath repo-visibility.vsix

      # Uses the trusted publisher registered on open-vsx.org for the armanossiloko namespace.
      - name: Publish to Open VSX
        run: npx ovsx publish repo-visibility.vsix --trusted-publishing

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" repo-visibility.vsix --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
